# Backend dev stack for testkit-service: postgres + redis + testkit (gRPC + gateway).
# nginx (frontend) is added in Task 17 together with the web/ Ant Design Pro app.
#
# Env wiring follows the golang-service-docker convention: every ${VAR} referenced
# by config.example.yaml (copied into the image as /app/config.yaml) is passed into
# the container as `KEY=${KEY:-default}`, with defaults mirrored from .env.example.
# configx (WithExpandEnv) expands those placeholders at startup, so the container
# picks up the same values a local `make run` would. An operator's gitignored .env
# overrides any default via compose interpolation; with no .env the inline defaults
# (compose-oriented: hosts are service names) make `docker compose up` work as-is.
#
# testkit's config contract uses TESTKIT_SERVICE_DB_* and TESTKIT_SERVICE_SERVER_GATEWAY_ADDR
# (not the skill template's DATABASE_* / SERVER_HTTP_ADDR); this file matches that
# contract so the values actually reach the config struct. The postgres credentials
# are derived from the SAME TESTKIT_SERVICE_DB_* vars the app connects with, so the
# DB and app can never drift out of sync.
#
# Migrate-then-serve uses the skill's Make-driven pattern (no compose migrate service):
#   make docker-migrate   # one-shot: builds, starts deps, runs `migrate`, exits
#   make docker-up        # build + up --wait (serves on :19095 / :18085)
# `make docker-migrate` leaves postgres+redis running, so `make docker-up` only adds
# the serving container.

services:
  testkit-service:
    image: ${IMAGE_REPOSITORY:-testkit-service}:${IMAGE_TAG:-latest}
    build:
      # Monorepo context (servekit root): go.mod replaces user-service with the
      # local checkout (../user-service), so the sibling must be inside the
      # build context. Dockerfile.dockerignore excludes everything the Go build
      # doesn't need. Drop back to "." + published versions when user-service
      # is re-published.
      context: ".."
      dockerfile: "testkit-service/Dockerfile"
      # Override GOPROXY in .env (e.g. GOPROXY=https://goproxy.cn,direct) when
      # proxy.golang.org is unreachable from the build host.
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    # Full var set from .env (see .env.example header): the environment: block
    # below only wires the vars the renderer knew about; config.example.yaml has
    # since grown (redis pool/timeouts, embedded user/message/storage config) and
    # env_file fills those in so configx never expands them to "".
    env_file:
      - .env
    environment:
      # --- Server (gRPC :19095, grpc-gateway :18085) ---
      - TESTKIT_SERVICE_SERVER_GRPC_ADDR=${TESTKIT_SERVICE_SERVER_GRPC_ADDR:-:19095}
      - TESTKIT_SERVICE_SERVER_GATEWAY_ADDR=${TESTKIT_SERVICE_SERVER_GATEWAY_ADDR:-:18085}
      # --- Database (PostgreSQL via dbx; shared across all four embedded modules) ---
      - TESTKIT_SERVICE_DB_HOST=${TESTKIT_SERVICE_DB_HOST:-postgres}
      - TESTKIT_SERVICE_DB_PORT=${TESTKIT_SERVICE_DB_PORT:-5432}
      - TESTKIT_SERVICE_DB_USER=${TESTKIT_SERVICE_DB_USER:-postgres}
      - TESTKIT_SERVICE_DB_PASSWORD=${TESTKIT_SERVICE_DB_PASSWORD:-change-me}
      - TESTKIT_SERVICE_DB_NAME=${TESTKIT_SERVICE_DB_NAME:-testkit}
      - TESTKIT_SERVICE_DB_SSLMODE=${TESTKIT_SERVICE_DB_SSLMODE:-disable}
      - TESTKIT_SERVICE_DB_MAX_OPEN_CONNS=${TESTKIT_SERVICE_DB_MAX_OPEN_CONNS:-25}
      - TESTKIT_SERVICE_DB_MAX_IDLE_CONNS=${TESTKIT_SERVICE_DB_MAX_IDLE_CONNS:-10}
      - TESTKIT_SERVICE_DB_CONN_MAX_LIFETIME=${TESTKIT_SERVICE_DB_CONN_MAX_LIFETIME:-5m}
      - TESTKIT_SERVICE_DB_LOG_LEVEL=${TESTKIT_SERVICE_DB_LOG_LEVEL:-warn}
      - TESTKIT_SERVICE_DB_SLOW_THRESHOLD=${TESTKIT_SERVICE_DB_SLOW_THRESHOLD:-200ms}
      - TESTKIT_SERVICE_DB_SKIP_DEFAULT_TX=${TESTKIT_SERVICE_DB_SKIP_DEFAULT_TX:-true}
      - TESTKIT_SERVICE_DB_DISABLE_FK=${TESTKIT_SERVICE_DB_DISABLE_FK:-true}
      - TESTKIT_SERVICE_DB_TABLE_PREFIX=${TESTKIT_SERVICE_DB_TABLE_PREFIX:-}
      # --- Redis (shared across all four embedded modules) ---
      - TESTKIT_SERVICE_REDIS_ADDR=${TESTKIT_SERVICE_REDIS_ADDR:-redis:6379}
      - TESTKIT_SERVICE_REDIS_PASSWORD=${TESTKIT_SERVICE_REDIS_PASSWORD:-}
      - TESTKIT_SERVICE_REDIS_DB=${TESTKIT_SERVICE_REDIS_DB:-0}
      # --- CORS (grpc-gateway HTTP surface) ---
      - TESTKIT_SERVICE_CORS_ALLOWED_ORIGINS=${TESTKIT_SERVICE_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      # --- Third-party: four downstream services, in-process (module) by default ---
      - TESTKIT_SERVICE_GID_MODE=${TESTKIT_SERVICE_GID_MODE:-module}
      - TESTKIT_SERVICE_GID_TARGET=${TESTKIT_SERVICE_GID_TARGET:-}
      - TESTKIT_SERVICE_GID_MACHINE_ID=${TESTKIT_SERVICE_GID_MACHINE_ID:-1}
      - TESTKIT_SERVICE_GID_START_TIME=${TESTKIT_SERVICE_GID_START_TIME:-2026-01-01T00:00:00Z}
      - TESTKIT_SERVICE_MESSAGE_MODE=${TESTKIT_SERVICE_MESSAGE_MODE:-module}
      - TESTKIT_SERVICE_MESSAGE_TARGET=${TESTKIT_SERVICE_MESSAGE_TARGET:-}
      - TESTKIT_SERVICE_STORAGE_MODE=${TESTKIT_SERVICE_STORAGE_MODE:-module}
      - TESTKIT_SERVICE_STORAGE_TARGET=${TESTKIT_SERVICE_STORAGE_TARGET:-}
      - TESTKIT_SERVICE_USER_MODE=${TESTKIT_SERVICE_USER_MODE:-module}
      - TESTKIT_SERVICE_USER_TARGET=${TESTKIT_SERVICE_USER_TARGET:-}
      # --- Third-party: license + telemetry (in-process modules) ---
      - TESTKIT_SERVICE_LICENSE_MODE=${TESTKIT_SERVICE_LICENSE_MODE:-module}
      - TESTKIT_SERVICE_LICENSE_TARGET=${TESTKIT_SERVICE_LICENSE_TARGET:-}
      - TESTKIT_SERVICE_LICENSE_SIGNING_KEY_ID=${TESTKIT_SERVICE_LICENSE_SIGNING_KEY_ID:-k1}
      - TESTKIT_SERVICE_LICENSE_SIGNING_SEED=${TESTKIT_SERVICE_LICENSE_SIGNING_SEED:-}
      - TESTKIT_SERVICE_LICENSE_SIGNING_SIGN_KEY_ID=${TESTKIT_SERVICE_LICENSE_SIGNING_SIGN_KEY_ID:-}
      - TESTKIT_SERVICE_TELEMETRY_MODE=${TESTKIT_SERVICE_TELEMETRY_MODE:-module}
      - TESTKIT_SERVICE_TELEMETRY_TARGET=${TESTKIT_SERVICE_TELEMETRY_TARGET:-}
      - TESTKIT_SERVICE_TELEMETRY_ADMIN_TOKEN=${TESTKIT_SERVICE_TELEMETRY_ADMIN_TOKEN:-}
      # --- Cron + logging ---
      - TESTKIT_SERVICE_CRON_TIMEZONE=${TESTKIT_SERVICE_CRON_TIMEZONE:-Asia/Shanghai}
      - TESTKIT_SERVICE_LOG_LEVEL=${TESTKIT_SERVICE_LOG_LEVEL:-info}
      - TESTKIT_SERVICE_LOG_FORMAT=${TESTKIT_SERVICE_LOG_FORMAT:-json}
    ports:
      - "${HOST_GRPC_PORT:-19095}:19095"
      - "${HOST_HTTP_PORT:-18085}:18085"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:19095", "-connect-timeout=2s"]
      interval: ${HEALTHCHECK_INTERVAL:-10s}
      timeout: ${HEALTHCHECK_TIMEOUT:-3s}
      retries: ${HEALTHCHECK_RETRIES:-6}
      start_period: ${HEALTHCHECK_START_PERIOD:-10s}

  # Frontend (nginx): serves the built SPA and reverse-proxies /api + /ping to
  # testkit-service. Build context is the repo root (web/Dockerfile copies web/
  # and api/swagger/, regenerates services via `npm run openapi`, then `max build`).
  nginx:
    image: ${WEB_IMAGE_REPOSITORY:-testkit-web}:${IMAGE_TAG:-latest}
    build:
      # Repo-root context (like testkit-service): the Dockerfile COPYs
      # web/... and api/gen/openapi/... paths relative to the root. A
      # previous "." context only worked via stale cache layers.
      context: ".."
      dockerfile: "testkit-service/web/Dockerfile"
    depends_on:
      testkit-service:
        condition: service_healthy
    ports:
      - "${HOST_NGINX_PORT:-8080}:80"
    # The JSON access log is high-volume — bound the container log so it
    # cannot grow unbounded on the host.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      # Seeded from the SAME vars the app authenticates with, so DB and app agree.
      - POSTGRES_DB=${TESTKIT_SERVICE_DB_NAME:-testkit}
      - POSTGRES_USER=${TESTKIT_SERVICE_DB_USER:-postgres}
      - POSTGRES_PASSWORD=${TESTKIT_SERVICE_DB_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TESTKIT_SERVICE_DB_USER:-postgres} -d ${TESTKIT_SERVICE_DB_NAME:-testkit}"]
      interval: ${POSTGRES_HEALTHCHECK_INTERVAL:-3s}
      timeout: ${POSTGRES_HEALTHCHECK_TIMEOUT:-3s}
      retries: ${POSTGRES_HEALTHCHECK_RETRIES:-20}
      start_period: ${POSTGRES_HEALTHCHECK_START_PERIOD:-10s}

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: ${REDIS_HEALTHCHECK_INTERVAL:-3s}
      timeout: ${REDIS_HEALTHCHECK_TIMEOUT:-3s}
      retries: ${REDIS_HEALTHCHECK_RETRIES:-20}
      start_period: ${REDIS_HEALTHCHECK_START_PERIOD:-3s}

volumes:
  pgdata:
    name: ${POSTGRES_VOLUME:-testkit-service-pgdata}
  redisdata:
    name: ${REDIS_VOLUME:-testkit-service-redisdata}
