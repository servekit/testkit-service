# Generated by golang-service-docker. Edit the skill inputs and rerender
# instead of hand-merging dependency files.

services:
  testkit-service:
    image: ${IMAGE_REPOSITORY:-testkit-service}:${IMAGE_TAG:-latest}
    build:
      context: "."
      dockerfile: "Dockerfile"
      # Override GOPROXY in .env (e.g. GOPROXY=https://goproxy.cn,direct) when
      # proxy.golang.org is unreachable from the build host.
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      - TESTKIT_SERVICE_SERVER_GRPC_ADDR=${TESTKIT_SERVICE_SERVER_GRPC_ADDR:-:9000}
      - TESTKIT_SERVICE_SERVER_HTTP_ADDR=${TESTKIT_SERVICE_SERVER_HTTP_ADDR:-:8080}
      - TESTKIT_SERVICE_LOG_LEVEL=${TESTKIT_SERVICE_LOG_LEVEL:-info}
      - TESTKIT_SERVICE_REDIS_ADDR=${TESTKIT_SERVICE_REDIS_ADDR:-redis:6379}
      - TESTKIT_SERVICE_REDIS_USERNAME=${TESTKIT_SERVICE_REDIS_USERNAME:-}
      - TESTKIT_SERVICE_REDIS_PASSWORD=${TESTKIT_SERVICE_REDIS_PASSWORD:-}
      - TESTKIT_SERVICE_REDIS_DB=${TESTKIT_SERVICE_REDIS_DB:-0}
      - TESTKIT_SERVICE_CRON_TIMEZONE=${TESTKIT_SERVICE_CRON_TIMEZONE:-Asia/Shanghai}
      - TESTKIT_SERVICE_LOG_FORMAT=${TESTKIT_SERVICE_LOG_FORMAT:-json}
      - TESTKIT_SERVICE_THIRD_PARTY_DEMO_CONFIG_MAX_INPUT_LEN=${TESTKIT_SERVICE_THIRD_PARTY_DEMO_CONFIG_MAX_INPUT_LEN:-1024}
      - TESTKIT_SERVICE_THIRD_PARTY_DEMO_CONFIG_PREFIX=${TESTKIT_SERVICE_THIRD_PARTY_DEMO_CONFIG_PREFIX:-[demo]}
      - TESTKIT_SERVICE_THIRD_PARTY_DEMO_MODE=${TESTKIT_SERVICE_THIRD_PARTY_DEMO_MODE:-module}
      - TESTKIT_SERVICE_THIRD_PARTY_DEMO_TARGET=${TESTKIT_SERVICE_THIRD_PARTY_DEMO_TARGET:-}
      - VAR=${VAR:-}
    ports:
      - "${HOST_GRPC_PORT:-9000}:9000"
      - "${HOST_HTTP_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=127.0.0.1:9000", "-connect-timeout=2s"]
      interval: ${HEALTHCHECK_INTERVAL:-10s}
      timeout: ${HEALTHCHECK_TIMEOUT:-3s}
      retries: ${HEALTHCHECK_RETRIES:-6}
      start_period: ${HEALTHCHECK_START_PERIOD:-10s}



  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: ${REDIS_HEALTHCHECK_INTERVAL:-3s}
      timeout: ${REDIS_HEALTHCHECK_TIMEOUT:-3s}
      retries: ${REDIS_HEALTHCHECK_RETRIES:-20}
      start_period: ${REDIS_HEALTHCHECK_START_PERIOD:-3s}

volumes:
  redisdata:
    name: ${REDIS_VOLUME:-testkit-service-redisdata}
