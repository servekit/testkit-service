syntax = "proto3";

package testkit.v1;

option go_package = "github.com/servekit/testkit-service/gen/testkit/v1;testkitv1";

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// Pong is the health-check response — only public, non-sensitive info
// (service name, build version, status, timestamps). Never include internal
// addresses, IPs, env vars, secrets, or dependency topology here.
message Pong {
  string service = 1;       // service name, e.g. "demo-service"
  string version = 2;       // semantic version (ldflags; "dev" by default)
  string git_commit = 3;    // short commit hash (ldflags or VCS-embedded)
  string git_branch = 4;    // git branch (ldflags)
  string build_time = 5;    // build time, RFC3339 UTC (ldflags)
  string go_version = 6;    // Go toolchain version (runtime, not injected)
  string status = 7;        // "SERVING" when serving normally
  int64 now = 8;            // server time, Unix millis
  int64 started_at = 9;     // process start time, Unix millis (client computes uptime)
}

// ==================== Auth (P1) ====================
//
// testkit.proto is self-contained (design spec v2 §3.1): it imports NO
// downstream proto. Every auth message below is a testkit-owned DTO, curated
// for the frontend (design spec §3.2). The enums mirror user-service
// (api/proto/user/v1/user.proto) name-for-name and number-for-number, so the
// testkit↔userv1 conversion in internal/service/auth is a plain int cast
// (userv1.LoginMethod(req.GetMethod())) — no string lookup. Re-defining them
// here (rather than importing) also gives the frontend real enum types in the
// generated swagger (v2 Delta C).
//
// Per curation rule §3.2.1, none of these request messages carry a "caller
// identity" field (user_id / owner): the BFF is the sole trust boundary and
// injects identity from ctx. session_id likewise never appears in a response —
// it lives only inside the JWT testkit issues (TokenResponse carries token+user).

// LoginMethod is the authentication strategy for Login. Mirrors
// user-service LoginMethod same-name/same-number.
enum LoginMethod {
  LOGIN_METHOD_UNSPECIFIED = 0;
  LOGIN_METHOD_EMAIL_PASSWORD = 1;
  LOGIN_METHOD_PHONE_PASSWORD = 2;
  LOGIN_METHOD_PHONE_CODE = 3;           // Auto-registers on missing identity.
  LOGIN_METHOD_EMAIL_CODE = 4;           // Auto-registers on missing identity.
  LOGIN_METHOD_USERNAME_PASSWORD = 5;
}

// IdentityProvider identifies which login system an identity belongs to. Mirrors
// user-service IdentityProvider same-name/same-number. ADMIN=8 is an audit tag
// for CreateUser — not a real login method (Login never uses it).
enum IdentityProvider {
  IDENTITY_PROVIDER_UNSPECIFIED = 0;
  IDENTITY_PROVIDER_EMAIL = 1;
  IDENTITY_PROVIDER_PHONE = 2;
  IDENTITY_PROVIDER_GITHUB = 3;
  IDENTITY_PROVIDER_GOOGLE = 4;
  IDENTITY_PROVIDER_WECHAT = 5;
  IDENTITY_PROVIDER_APPLE = 6;
  IDENTITY_PROVIDER_WECHAT_MINIPROGRAM = 7;
  IDENTITY_PROVIDER_ADMIN = 8;           // Audit tag for CreateUser; not a login method.
}

// VerificationChannel is the delivery channel for SendVerificationCode. Mirrors
// user-service VerificationChannel same-name/same-number.
enum VerificationChannel {
  VERIFICATION_CHANNEL_UNSPECIFIED = 0;
  VERIFICATION_CHANNEL_EMAIL = 1;
  VERIFICATION_CHANNEL_SMS = 2;
}

// VerificationPurpose binds a code to its consuming RPC, preventing cross-context
// replay. Mirrors user-service VerificationPurpose same-name/same-number.
enum VerificationPurpose {
  VERIFICATION_PURPOSE_UNSPECIFIED = 0;
  VERIFICATION_PURPOSE_REGISTER = 1;       // Consumed by Register.
  VERIFICATION_PURPOSE_LOGIN = 2;          // Consumed by Login (code methods).
  VERIFICATION_PURPOSE_VERIFY_EMAIL = 3;   // EMAIL channel only.
  VERIFICATION_PURPOSE_VERIFY_PHONE = 4;   // SMS channel only.
  VERIFICATION_PURPOSE_PASSWORD_RESET = 5; // Consumed by ResetPassword (TBD).
  VERIFICATION_PURPOSE_BIND = 6;           // Consumed by BindIdentity (TBD).
}

// UserType separates external end users from internal platform users. Mirrors
// user-service UserType same-name/same-number. Drives the two-track frontend
// (design spec §3.5): INTERNAL → 内部后台管理页, NORMAL → 普通用户后端页. This is
// a frontend route/menu split only — NOT RBAC; backend admin endpoints do login-
// state + identity injection only this phase.
enum UserType {
  USER_TYPE_UNSPECIFIED = 0;
  USER_TYPE_NORMAL = 1;   // External end user (default).
  USER_TYPE_INTERNAL = 2; // Platform internal user (staff, operations, etc.).
}

// ==================== P2 shared enums (mirror user-service name-for-name,
// number-for-number) ====================
//
// Conversion in internal/service/user is a plain int cast, e.g.
// uservl.UserStatus(req.GetStatus()). See design spec §3.1 (self-contained
// proto) — these are re-defined here rather than imported so the generated
// swagger exposes real enum types to the frontend, and so testkit never
// depends on a downstream .proto.

// UserStatus is the account lifecycle state. Mirrors user-service
// same-name/same-number.
enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_DISABLED = 2;
  USER_STATUS_PENDING_REVIEW = 3;
}

// Gender is the user's self-reported gender. Mirrors user-service
// same-name/same-number.
enum Gender {
  GENDER_UNSPECIFIED = 0;
  GENDER_MALE = 1;
  GENDER_FEMALE = 2;
  GENDER_OTHER = 3;
  GENDER_UNKNOWN = 4;
}

// DeviceType categorizes the client device for session/audit metadata. Mirrors
// user-service same-name/same-number.
enum DeviceType {
  DEVICE_TYPE_UNSPECIFIED = 0;
  DEVICE_TYPE_WEB = 1;
  DEVICE_TYPE_IOS = 2;
  DEVICE_TYPE_ANDROID = 3;
  DEVICE_TYPE_API = 4;
}

// LoginAction classifies a login audit log entry. Mirrors user-service
// same-name/same-number.
enum LoginAction {
  LOGIN_ACTION_UNSPECIFIED = 0;
  LOGIN_ACTION_LOGIN = 1;
  LOGIN_ACTION_REGISTER = 2;
  LOGIN_ACTION_SOCIAL_LOGIN = 3;
  LOGIN_ACTION_SOCIAL_REGISTER = 4;
  LOGIN_ACTION_BIND = 5;
  LOGIN_ACTION_UNBIND = 6;
}

// UserSortField is the sort column for ListUsers / ListUsersPaged. Mirrors
// user-service same-name/same-number.
enum UserSortField {
  USER_SORT_FIELD_UNSPECIFIED = 0;
  USER_SORT_FIELD_ID = 1;
  USER_SORT_FIELD_CREATED_AT = 2;
  USER_SORT_FIELD_UPDATED_AT = 3;
  USER_SORT_FIELD_LAST_LOGIN_AT = 4;
}

// LoginRequest is the curated frontend DTO for login. Field names line up 1:1
// with user-service LoginRequest; the auth mapping layer int-casts the enums.
message LoginRequest {
  LoginMethod method = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  string username = 2 [(buf.validate.field).string.max_len = 256];
  string password = 3 [(buf.validate.field).string.max_len = 128];
  string code = 4 [(buf.validate.field).string.max_len = 16];
  string email = 5 [(buf.validate.field).string.max_len = 256];
  string region_code = 6 [(buf.validate.field).string.pattern = "^[A-Z]{2}$"];
  string phone = 7 [(buf.validate.field).string.max_len = 20];
  // captcha_id returned by SendVerificationCode; required for code-based login.
  string captcha_id = 8 [(buf.validate.field).string.max_len = 128];
}

// RegisterRequest is the curated frontend DTO for registration.
message RegisterRequest {
  IdentityProvider provider = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  string email = 2 [(buf.validate.field).string.max_len = 256];
  string code = 3 [(buf.validate.field).string = {min_len: 1, max_len: 16}];
  string username = 4 [(buf.validate.field).string.max_len = 64];
  string nickname = 5 [(buf.validate.field).string.max_len = 64];
  string password = 6 [(buf.validate.field).string.max_len = 128];
  string region_code = 7 [(buf.validate.field).string.pattern = "^[A-Z]{2}$"];
  string phone = 8 [(buf.validate.field).string.max_len = 20];
  // captcha_id returned by SendVerificationCode; required to verify the code.
  string captcha_id = 9 [(buf.validate.field).string.max_len = 128];
}

// SendVerificationCodeRequest is the curated frontend DTO for requesting a
// verification code. The vendor template fields (sms_template_id, email_body,
// ...) live in user-service and are intentionally NOT exposed here — the BFF
// supplies them from server config, not the frontend (design spec §3.2.2).
message SendVerificationCodeRequest {
  string email = 1 [(buf.validate.field).string.max_len = 256];
  VerificationChannel channel = 2 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  VerificationPurpose purpose = 3 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  string region_code = 4 [(buf.validate.field).string.pattern = "^[A-Z]{2}$"];
  string phone = 5 [(buf.validate.field).string.max_len = 20];
  // sender_id is the audit actor triggering this send (user id, service name,
  // platform identifier, ...). user-service is stateless and passes it through
  // verbatim; for unauthenticated flows (register/login) the frontend supplies
  // a platform identifier (e.g. the target email/phone or "testkit-web").
  string sender_id = 6 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
}

// SendVerificationCodeResponse returns the captcha_id that binds the generated
// code to this flow; it must be passed back to Register/Login.
message SendVerificationCodeResponse {
  string captcha_id = 1;
}

// RefreshSessionRequest refreshes the caller's session. session_id is optional:
// when empty, the handler derives it from the authenticated context
// (auth.SessionIDFromCtx). The response is a freshly-issued JWT.
message RefreshSessionRequest {
  string session_id = 1 [(buf.validate.field).string.max_len = 128];
}

// User is the frontend-facing user shape (P2 enriched). Fields are renumbered
// sequentially vs uservl.User (which has gaps from historical edits); the
// mapping layer translates field-by-name, not field-by-number. Unlike P1's
// 6-field login view, this carries the full profile surface (status, gender,
// timestamps, register_source, ...) used by profile/admin UIs. user_type is
// retained so the frontend can still do its two-track split (design spec §3.5).
message User {
  int64 id = 1;
  string username = 2;
  string nickname = 3;
  string real_name = 4;
  string avatar_url = 5;
  string email = 6;
  string region_code = 7;
  string phone = 8;
  Gender gender = 9 [(buf.validate.field).enum.defined_only = true];
  string birthday = 10; // YYYY-MM-DD
  string timezone = 11;
  string locale = 12;
  string bio = 13;
  UserStatus status = 14 [(buf.validate.field).enum.defined_only = true];
  IdentityProvider register_source = 15;
  UserType user_type = 16 [(buf.validate.field).enum.defined_only = true];
  google.protobuf.Timestamp last_login_at = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp updated_at = 19;
}

// ---- P2 shared entity messages (curated frontend-facing shapes) ----

// Identity is a login method linked to a user (email, phone, each OAuth
// provider, miniprogram openid).
message Identity {
  int64 id = 1;
  IdentityProvider provider = 2 [(buf.validate.field).enum.defined_only = true];
  string provider_uid = 3;
  bool verified = 4;
  google.protobuf.Timestamp created_at = 5;
}

// Session is an active login session for the "manage devices" UI.
message Session {
  string id = 1;
  string ip = 2;
  DeviceType device_type = 3 [(buf.validate.field).enum.defined_only = true];
  string os = 4;
  string browser = 5;
  string country = 6;
  string city = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp last_active_at = 9;
  bool current = 10;
}

// Group is an organizational unit; members inherit the group's roles.
message Group {
  int64 id = 1;
  string name = 2;
  string description = 3;
  int64 parent_id = 4;
  string status = 5;
  int32 member_count = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// Role is a named bundle of permissions assignable to users or groups.
message Role {
  int64 id = 1;
  string name = 2;
  string description = 3;
  bool is_builtin = 4;
  repeated Permission permissions = 5;
  repeated PermissionGroup perm_groups = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// Permission is a resource:action catalog entry.
message Permission {
  int64 id = 1;
  string resource = 2;
  string action = 3;
  string description = 4;
  bool is_builtin = 5;
}

// PermissionGroup is a named bundle of permissions.
message PermissionGroup {
  int64 id = 1;
  string name = 2;
  string description = 3;
  repeated Permission permissions = 4;
  bool is_builtin = 5;
}

// GroupMember is a user's membership row within a group.
message GroupMember {
  int64 user_id = 1;
  string nickname = 2;
  string avatar_url = 3;
  string role = 4;
  google.protobuf.Timestamp created_at = 5;
}

// LoginLog is one row of the login audit trail.
message LoginLog {
  int64 id = 1;
  int64 user_id = 2;
  IdentityProvider provider = 3;
  LoginAction action = 4;
  bool success = 5;
  string fail_reason = 6;
  string ip = 7;
  DeviceType device_type = 8;
  string os = 9;
  string browser = 10;
  string country = 11;
  string city = 12;
  google.protobuf.Timestamp created_at = 13;
}

// UserRole is one role held by a user (direct or group-inherited).
message UserRole {
  int64 id = 1;
  int64 role_id = 2;
  string role_name = 3;
  string source = 4; // "direct" | "group:<group_name>"
  google.protobuf.Timestamp created_at = 5;
}

// TokenResponse is returned by every login-class RPC (Login, Register,
// RefreshSession). It carries the JWT (which embeds session_id internally) plus
// the curated user. session_id is deliberately NOT surfaced — the frontend
// holds only the token (design spec §5.1/§11).
message TokenResponse {
  string token = 1;
  User user = 2;
}

// ==================== P2 request/response messages ====================
//
// Curation (design spec §3.2): "my" RPCs (GetProfile / UpdateProfile /
// ChangePassword / ListIdentities / BindIdentity / BindOAuthIdentity /
// UnbindIdentity / ListSessions / RevokeAllSessions) drop the caller's user_id
// — the BFF injects it from ctx. Target resource IDs (user_id / identity_id /
// session_id / group_id / role_id / permission_id / permission_group_id) are
// kept: they describe WHAT is acted on, not WHO is calling.

// ---- Profile (P2) ----
message GetProfileRequest {} // user_id injected from ctx

message UpdateProfileRequest {
  string username = 1 [(buf.validate.field).string.max_len = 64];
  string nickname = 2 [(buf.validate.field).string.max_len = 64];
  string real_name = 3 [(buf.validate.field).string.max_len = 64];
  string avatar_url = 4 [(buf.validate.field).string.max_len = 512];
  Gender gender = 5 [(buf.validate.field).enum.defined_only = true];
  string birthday = 6 [(buf.validate.field).string.max_len = 10];
  string timezone = 7 [(buf.validate.field).string.max_len = 64];
  string locale = 8 [(buf.validate.field).string.max_len = 16];
  string bio = 9 [(buf.validate.field).string.max_len = 512];
}

message ChangePasswordRequest {
  string old_password = 1 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
  string new_password = 2 [(buf.validate.field).string = {min_len: 8, max_len: 128}];
}

message ResetPasswordRequest {
  string email = 1 [(buf.validate.field).string.max_len = 256];
  string code = 2 [(buf.validate.field).string = {min_len: 1, max_len: 16}];
  string new_password = 3 [(buf.validate.field).string = {min_len: 8, max_len: 128}];
  string region_code = 4 [(buf.validate.field).string.pattern = "^[A-Z]{2}$"];
  string phone = 5 [(buf.validate.field).string.max_len = 20];

  option (buf.validate.message).cel = {
    id: "target_exclusive"
    message: "exactly one of email or region_code+phone must be set"
    expression: "(this.email != '' && this.region_code == '' && this.phone == '') || (this.email == '' && this.region_code != '' && this.phone != '')"
  };
}

// ---- Identity (P2) ----
message ListIdentitiesRequest {} // user_id from ctx

message ListIdentitiesResponse {
  repeated Identity identities = 1;
}

message BindIdentityRequest {
  IdentityProvider provider = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  string email = 2 [(buf.validate.field).string.max_len = 256];
  string code = 3 [(buf.validate.field).string = {min_len: 1, max_len: 16}];
  string password = 4 [(buf.validate.field).string.max_len = 128];
  string region_code = 5 [(buf.validate.field).string.pattern = "^[A-Z]{2}$"];
  string phone = 6 [(buf.validate.field).string.max_len = 20];

  option (buf.validate.message).cel = {
    id: "target_exclusive"
    message: "exactly one of email or region_code+phone must be set"
    expression: "(this.email != '' && this.region_code == '' && this.phone == '') || (this.email == '' && this.region_code != '' && this.phone != '')"
  };
}

message BindOAuthIdentityRequest {
  IdentityProvider provider = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0, 1, 2]}]; // OAuth only
  string code = 2 [(buf.validate.field).string = {min_len: 1, max_len: 512}];
  string state = 3 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
}

message BindOAuthIdentityResponse {
  Identity identity = 1;
}

message UnbindIdentityRequest {
  int64 identity_id = 1 [(buf.validate.field).int64.gt = 0]; // target identity
  string code = 2 [(buf.validate.field).string = {min_len: 1, max_len: 16}];
  // user_id injected from ctx
}

// ---- Session (P2) ----
message ListSessionsRequest {} // user_id from ctx

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message RevokeSessionRequest {
  string session_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
}

message RevokeAllSessionsRequest {} // user_id from ctx

message GetSessionRequest {
  string session_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
}

message GetSessionResponse {
  int64 user_id = 1;
  google.protobuf.Timestamp expires_at = 2;
  google.protobuf.Timestamp created_at = 3;
  string ip = 4;
  string user_agent = 5;
  string os = 6;
  string browser = 7;
  string login_method = 8;
}

message IssueSessionCodeRequest {
  string session_id = 1 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
}

message IssueSessionCodeResponse {
  string code = 1;
}

message ExchangeSessionCodeRequest {
  string code = 1 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
}

message ExchangeSessionCodeResponse {
  string session_id = 1;
  int64 user_id = 2;
}

// ---- Social (P2) ----
// All four are public (no caller user_id). SocialLogin / MiniProgram* consume
// the downstream session_id to issue a testkit JWT — session_id is never
// surfaced (design spec §5.1).
message GetOAuthURLRequest {
  IdentityProvider provider = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  string return_to = 2 [(buf.validate.field).string.max_len = 512];
  string state = 3 [(buf.validate.field).string.max_len = 128];
}

message GetOAuthURLResponse {
  string url = 1;
  string state = 2;
}

message SocialLoginRequest {
  IdentityProvider provider = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  string code = 2 [(buf.validate.field).string = {min_len: 1}];
  string state = 3 [(buf.validate.field).string = {min_len: 1, max_len: 128}];
}

message MiniProgramLoginRequest {
  string code = 1 [(buf.validate.field).string = {min_len: 1}];
  string nickname = 2 [(buf.validate.field).string.max_len = 64];
  string avatar_url = 3 [(buf.validate.field).string.max_len = 512];
}

message MiniProgramPhoneLoginRequest {
  string login_code = 1 [(buf.validate.field).string = {min_len: 1}];
  string phone_code = 2 [(buf.validate.field).string = {min_len: 1}];
  string nickname = 3 [(buf.validate.field).string.max_len = 64];
  string avatar_url = 4 [(buf.validate.field).string.max_len = 512];
}

// SocialLoginResponse is the shared response for all social-login RPCs.
// token = testkit-issued JWT (consumes the downstream session_id); session_id
// itself is NOT returned to the frontend.
message SocialLoginResponse {
  string token = 1;
  User user = 2;
  bool is_new = 3;
  string return_to = 4; // meaningful only for SocialLogin (OAuth callback flow)
}

// ---- Admin-Users (P2) ----
// target user_id is kept; GetLoginLogs.user_id is an optional filter.
message CreateUserRequest {
  UserType user_type = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  string username = 2 [(buf.validate.field).string.max_len = 64];
  string nickname = 3 [(buf.validate.field).string.max_len = 64];
  string real_name = 4 [(buf.validate.field).string.max_len = 64];
  string email = 5 [(buf.validate.field).string.max_len = 256];
  string region_code = 6 [(buf.validate.field).string.pattern = "^[A-Z]{2}$"];
  string phone = 7 [(buf.validate.field).string.max_len = 20];
  string password = 8 [(buf.validate.field).string = {min_len: 8, max_len: 128}];
  Gender gender = 9 [(buf.validate.field).enum.defined_only = true];
  string timezone = 10 [(buf.validate.field).string.max_len = 64];
  string locale = 11 [(buf.validate.field).string.max_len = 16];
}

message CreateUserResponse {
  User user = 1;
}

message GetUserRequest {
  int64 user_id = 1 [(buf.validate.field).int64.gt = 0]; // target user (kept)
}

message DisableUserRequest {
  int64 user_id = 1 [(buf.validate.field).int64.gt = 0]; // target user (kept)
  bool disable = 2;
  string reason = 3 [(buf.validate.field).string.max_len = 512];
}

message ListUsersRequest {
  UserStatus status = 1;
  string nickname = 2 [(buf.validate.field).string.max_len = 64];
  int32 page_size = 3 [(buf.validate.field).int32 = {gte: 1, lte: 100}];
  string cursor = 4 [(buf.validate.field).string.max_len = 64];
  Gender gender = 5;
  IdentityProvider register_source = 6;
  DeviceType register_device = 7;
  string locale = 8 [(buf.validate.field).string.max_len = 16];
  string timezone = 9 [(buf.validate.field).string.max_len = 64];
  string register_ip = 10 [(buf.validate.field).string.max_len = 45];
  string last_login_ip = 11 [(buf.validate.field).string.max_len = 45];
  google.protobuf.Timestamp created_at_start = 12;
  google.protobuf.Timestamp created_at_end = 13;
  google.protobuf.Timestamp last_login_at_start = 14;
  google.protobuf.Timestamp last_login_at_end = 15;
  repeated int64 user_ids = 16;
  string email = 17 [(buf.validate.field).string.max_len = 256];
  string region_code = 18 [(buf.validate.field).string.pattern = "^[A-Z]{2}$"];
  string phone = 19 [(buf.validate.field).string.max_len = 20];
  string username = 20 [(buf.validate.field).string.max_len = 64];
  UserType user_type = 21 [(buf.validate.field).enum.defined_only = true];
  UserSortField order_by = 22 [(buf.validate.field).enum.defined_only = true];
  bool descending = 23;
}

message ListUsersResponse {
  repeated User users = 1;
  string next_cursor = 2;
}

message ListUsersPagedRequest {
  UserStatus status = 1;
  string nickname = 2 [(buf.validate.field).string.max_len = 64];
  Gender gender = 3;
  IdentityProvider register_source = 4;
  DeviceType register_device = 5;
  UserType user_type = 6;
  string locale = 7 [(buf.validate.field).string.max_len = 16];
  string timezone = 8 [(buf.validate.field).string.max_len = 64];
  string register_ip = 9 [(buf.validate.field).string.max_len = 45];
  string last_login_ip = 10 [(buf.validate.field).string.max_len = 45];
  google.protobuf.Timestamp created_at_start = 11;
  google.protobuf.Timestamp created_at_end = 12;
  google.protobuf.Timestamp last_login_at_start = 13;
  google.protobuf.Timestamp last_login_at_end = 14;
  repeated int64 user_ids = 15;
  string email = 16 [(buf.validate.field).string.max_len = 256];
  string region_code = 17 [(buf.validate.field).string.pattern = "^[A-Z]{2}$"];
  string phone = 18 [(buf.validate.field).string.max_len = 20];
  string username = 19 [(buf.validate.field).string.max_len = 64];
  UserSortField order_by = 20 [(buf.validate.field).enum.defined_only = true];
  bool descending = 21;
