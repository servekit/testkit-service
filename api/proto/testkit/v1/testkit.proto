  repeated AuditLogEntry logs = 1;
  int32 total_count = 2;
  string next_page_token = 3;
}

// ==================== Message (P4) ====================
//
// testkit.proto is self-contained (design spec v2 §3.1): it imports NO
// downstream proto. The message enums/messages below mirror message-service
// (api/proto/message/v1/message.proto) name-for-name and number-for-number, so
// every testkit↔messagev1 conversion in internal/service/message is a plain int
// cast (messagev1.EmailScene(req.GetScene())) — no string table. Re-defining
// them here (rather than importing) keeps the proto self-contained and gives
// the frontend real enum types in the generated swagger.
//
// Curation (plan §3.2 + P4 decisions):
//   - sender_id is a SERVICE LABEL (the calling business service, e.g.
//     "testkit-service"), NOT a user id. It never appears on a testkit Send
//     request — the BFF injects it from cfg.Message.SenderID (decision 1).
//   - List/Stats requests expose no sender_id filter either way (decision 2):
//     the ops console sees all records across senders.
//   - Get keeps the resource id (operation target — decision 3).
//   - SendResponse splits the downstream oneof vendor into two optional fields
//     (decision 6): email_vendor / sms_vendor (only one is non-zero at a time).
//   - EmailRecord/SMSRecord keep full fidelity for ops triage (decision 7);
//     sender_id is a read-only echo of what the caller injected.

// SortField is shared with the storage domain (defined above, P3). The message
// UI only offers CREATED_AT; the storage-only FILENAME/SIZE values are never
// sent for message lists. The int cast to messagev1.SortField is unaffected
// (message-service defines only UNSPECIFIED + CREATED_AT).

// SortDirection selects ascending or descending order for message lists.
// Mirrors message-service name-for-name and number-for-number.
enum SortDirection {
  SORT_DIRECTION_UNSPECIFIED = 0;
  SORT_DIRECTION_ASC = 1;
  SORT_DIRECTION_DESC = 2;
}

enum MessageStatus {
  MESSAGE_STATUS_UNSPECIFIED = 0;
  MESSAGE_STATUS_PENDING = 1;
  MESSAGE_STATUS_SENT = 2;
  MESSAGE_STATUS_FAILED = 3;
}

enum EmailVendor {
  EMAIL_VENDOR_UNSPECIFIED = 0;
  EMAIL_VENDOR_ALIYUN = 1;
  EMAIL_VENDOR_TENCENT = 2;
  EMAIL_VENDOR_NETEASE = 3;
}

enum SmsVendor {
  SMS_VENDOR_UNSPECIFIED = 0;
  SMS_VENDOR_ALIYUN = 1;
  SMS_VENDOR_TENCENT = 2;
  SMS_VENDOR_VOLCENGINE = 3;
  SMS_VENDOR_BYTEPLUS = 4;
  SMS_VENDOR_HUAWEI = 5;
}

enum EmailScene {
  EMAIL_SCENE_UNSPECIFIED = 0;
  EMAIL_SCENE_LOGIN_CODE = 1;
  EMAIL_SCENE_FORGOT_PASSWORD = 2;
  EMAIL_SCENE_REGISTER = 3;
  EMAIL_SCENE_CHANGE_PASSWORD = 4;
  EMAIL_SCENE_BIND_ACCOUNT = 5;
  EMAIL_SCENE_NOTIFICATION = 6;
  EMAIL_SCENE_VERIFY_EMAIL = 7;
}

enum SmsScene {
  SMS_SCENE_UNSPECIFIED = 0;
  SMS_SCENE_LOGIN_CODE = 1;
  SMS_SCENE_FORGOT_PASSWORD = 2;
  SMS_SCENE_REGISTER = 3;
  SMS_SCENE_CHANGE_PASSWORD = 4;
  SMS_SCENE_BIND_ACCOUNT = 5;
  SMS_SCENE_VERIFY_PHONE = 6;
}

// ---- Message shared entities (P4) ----
// Nested messages are redefined in testkit (decision 5), not imported.

// EmailAddress mirrors the downstream message (email + display_name).
message EmailAddress {
  string email = 1 [(buf.validate.field).string.email = true];
  string display_name = 2;
}

// EmailAttachment drops the downstream `reserved` placeholders and renumbers
// cleanly. url/content are XOR (enforced downstream); DB stores metadata only
// (content is not persisted, so record echoes have it empty).
message EmailAttachment {
  string filename = 1 [(buf.validate.field).string.min_len = 1];
  string url = 2;
  bytes content = 3;
  bool inline = 4;
  string mime_type = 5;
  int64 size_bytes = 6;
}

// EmailVendorStats / SmsVendorStats mirror the downstream per-vendor breakdown.
message EmailVendorStats {
  EmailVendor vendor = 1;
  int64 total = 2;
  int64 sent = 3;
  int64 failed = 4;
}
message SmsVendorStats {
  SmsVendor vendor = 1;
  int64 total = 2;
  int64 sent = 3;
  int64 failed = 4;
}

// ---- Send (sender_id dropped — BFF fills from cfg.Message.SenderID) ----

message SendEmailRequest {
  repeated EmailAddress to = 1 [(buf.validate.field).repeated.min_items = 1];
  repeated EmailAddress cc = 2;
  repeated EmailAddress bcc = 3;
  string subject = 4 [(buf.validate.field).string.min_len = 1];
  string body = 5;
  string html_body = 6;
  EmailAddress reply_to = 7;
  EmailVendor vendor = 8;
  string account = 9;
  string template_id = 10;
  map<string, string> template_params = 11;
  EmailScene scene = 12;
  // sender_id NOT exposed — BFF fills from cfg.Message.SenderID (decision 1).
  string idempotency_key = 13 [(buf.validate.field).string.max_len = 64];
  EmailAddress from = 14;
  repeated EmailAttachment attachments = 15;

  option (buf.validate.message).cel = {
    id: "vendor_account_pair"
    message: "vendor and account must both be set or both be empty"
    expression: "(this.vendor == 0 && this.account == '') || (this.vendor != 0 && this.account != '')"
  };
  option (buf.validate.message).cel = {
    id: "scene_required"
    message: "scene is required"
    expression: "this.scene != 0"
  };
}

message SendSMSRequest {
  string region_code = 1 [(buf.validate.field).string.pattern = "^[A-Z]{2}$"];
  string phone = 2 [(buf.validate.field).string.min_len = 1];
  string content = 3;
  string template_id = 4;
  map<string, string> template_params = 5;
  SmsVendor vendor = 6;
  string account = 7;
  SmsScene scene = 8;
  // sender_id NOT exposed — BFF fills from cfg.Message.SenderID (decision 1).
  string idempotency_key = 9 [(buf.validate.field).string.max_len = 64];
  string sign_name = 10 [(buf.validate.field).string.max_len = 64];

  option (buf.validate.message).cel = {
    id: "vendor_account_pair"
    message: "vendor and account must both be set or both be empty"
    expression: "(this.vendor == 0 && this.account == '') || (this.vendor != 0 && this.account != '')"
  };
  option (buf.validate.message).cel = {
    id: "scene_required"
    message: "scene is required"
    expression: "this.scene != 0"
  };
  option (buf.validate.message).cel = {
    id: "phone_no_plus"
    message: "phone must not start with '+'"
    expression: "!this.phone.startsWith('+')"
  };
}

// SendResponse splits the downstream oneof vendor into two optional fields
// (decision 6): exactly one of email_vendor / sms_vendor is non-zero.
message SendResponse {
  int64 id = 1;
  MessageStatus status = 2;
  EmailVendor email_vendor = 3;
  SmsVendor sms_vendor = 4;
}

// ---- Records (full fidelity for ops triage — decision 7) ----

message EmailRecord {
  int64 id = 1;
  EmailVendor vendor = 2;
  string account = 3;
  EmailScene scene = 4;
  MessageStatus status = 5;
  EmailAddress target = 6;
  string sender_id = 7;  // read-only echo (testkit's sends echo cfg.Message.SenderID)
  repeated EmailAddress cc = 8;
  repeated EmailAddress bcc = 9;
  string subject = 10;
  string content = 11;
  string html_body = 12;
  EmailAddress reply_to = 13;
  string template_id = 14;
  map<string, string> template_params = 15;
  string error_message = 16;
  int32 attempts = 17;
  int64 sent_at = 18;
  int64 created_at = 19;
  int64 updated_at = 20;
  repeated EmailAttachment attachments = 21;
}

message SMSRecord {
  int64 id = 1;
  SmsVendor vendor = 2;
  string account = 3;
  SmsScene scene = 4;
  MessageStatus status = 5;
  string region_code = 6;
  string phone = 7;
  string sender_id = 8;
  string content = 9;
  string template_id = 10;
  map<string, string> template_params = 11;
  string error_message = 12;
  int32 attempts = 13;
  int64 sent_at = 14;
  int64 created_at = 15;
  int64 updated_at = 16;
}

// ---- Get (resource id kept — decision 3) ----

message GetEmailRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}
message GetSMSRequest {
  int64 id = 1 [(buf.validate.field).int64.gt = 0];
}

// ---- List paged (sender_id filter dropped — decision 2) ----

message ListEmailsRequest {
  EmailVendor vendor = 1;
  EmailScene scene = 2;
  MessageStatus status = 3;
  string target = 4;
  int64 start_time = 5;
  int64 end_time = 6;
  int32 page = 7;
  int32 page_size = 8;
  SortField sort_field = 9;
  SortDirection sort_direction = 10;
}
message ListEmailsResponse {
  repeated EmailRecord records = 1;
  int32 total = 2;
  int32 total_pages = 3;
  bool has_more = 4;
}

message ListSMSRequest {
  SmsVendor vendor = 1;
  SmsScene scene = 2;
  MessageStatus status = 3;
  string region_code = 4;
  string phone = 5;
  int64 start_time = 6;
  int64 end_time = 7;
  int32 page = 8;
  int32 page_size = 9;
  SortField sort_field = 10;
  SortDirection sort_direction = 11;
}
message ListSMSResponse {
  repeated SMSRecord records = 1;
  int32 total = 2;
  int32 total_pages = 3;
  bool has_more = 4;
}

// ---- List cursor (sender_id filter dropped) ----

message ListEmailsByCursorRequest {
  EmailVendor vendor = 1;
  EmailScene scene = 2;
  MessageStatus status = 3;
  string target = 4;
  int64 start_time = 5;
  int64 end_time = 6;
  SortField sort_field = 7;
  SortDirection sort_direction = 8;
  int32 page_size = 9;
  string page_token = 10;
  bool include_total = 11;
}
message ListEmailsByCursorResponse {
  repeated EmailRecord records = 1;
  int32 total = 2;
  string next_page_token = 3;
}

message ListSMSByCursorRequest {
  SmsVendor vendor = 1;
  SmsScene scene = 2;
  MessageStatus status = 3;
  string region_code = 4;
  string phone = 5;
  int64 start_time = 6;
  int64 end_time = 7;
  SortField sort_field = 8;
  SortDirection sort_direction = 9;
  int32 page_size = 10;
  string page_token = 11;
  bool include_total = 12;
}
message ListSMSByCursorResponse {
  repeated SMSRecord records = 1;
  int32 total = 2;
  string next_page_token = 3;
}

// ---- Stats (sender_id filter dropped) ----

message GetEmailStatsRequest {
  EmailVendor vendor = 1;
  EmailScene scene = 2;
  int64 start_time = 3;
  int64 end_time = 4;
}
message EmailStatsResponse {
  int64 total = 1;
  int64 sent = 2;
  int64 failed = 3;
  double success_rate = 4;  // [0,100]; -1 = no data
  repeated EmailVendorStats vendors = 5;
}

message GetSMSStatsRequest {
  SmsVendor vendor = 1;
  SmsScene scene = 2;
  int64 start_time = 3;
  int64 end_time = 4;
}
message SMSStatsResponse {
  int64 total = 1;
  int64 sent = 2;
  int64 failed = 3;
  double success_rate = 4;
  repeated SmsVendorStats vendors = 5;
}

// ---- Lookups (dropdown sources) ----

message ListEmailSendersRequest {}
message ListEmailSendersResponse {
  repeated string sender_ids = 1;
}
message ListSMSSendersRequest {}
message ListSMSSendersResponse {
  repeated string sender_ids = 1;
}
message ListSMSRegionsRequest {}
message ListSMSRegionsResponse {
  repeated string region_codes = 1;
}

// ==================== GID debug (P5) ====================
//
// Mirrors gid-service/api/proto/gid/v1/gid.proto shape-for-shape. gid RPCs
// carry no caller-identity (global unique ID generation is caller-agnostic), so
// the testkit-owned messages are identical to gid.proto and the mapping layer
// (internal/service/gid) is a plain field copy. Only the type ownership moves
// to testkit.v1 (design spec v2 §3.1 — testkit.proto imports no downstream
// proto). protovalidate enforces count ∈ [1,1000] and id >= 1; downstream
// failures pass through as xerr (§9).

message NextIDRequest {}

message NextIDResponse {
  int64 id = 1;
}

message BatchNextIDRequest {
  int32 count = 1 [(buf.validate.field).int32 = {gte: 1, lte: 1000}];
}

message BatchNextIDResponse {
  repeated int64 ids = 1;
}

message DecomposeRequest {
  int64 id = 1 [(buf.validate.field).int64 = {gte: 1}];
}

message DecomposeResponse {
  int64 time = 1;
  int64 sequence = 2;
  int64 machine_id = 3;
  string generated_at = 4; // ISO8601 timestamp
}

// ==================== Dashboard (P5, aggregated) ====================
//
// GetDashboard fans out to message.GetEmailStats + message.GetSMSStats +
// storage.GetMyQuota + user.ListUsersPaged concurrently (fail-fast via errgroup)
// and assembles this response (design spec §10 "聚合型" reference example).
//
// The caller's Owner (for GetMyQuota) is injected from ctx by the BFF — it is
// NEVER present in GetDashboardRequest (v2 §3.2 rule 1: the BFF is the sole
// trust boundary). EmailVendor / SmsVendor / EmailVendorStats / SmsVendorStats
// are reused as-is from P4 above (mirrored from message.proto name-for-name and
// number-for-number), so the mapping layer is a plain int cast — no redefinition
// here. The sub-structures (EmailStats / SMSStats / MyQuota / UsersSummary)
// mirror the downstream response shapes as read-only snapshots.

message GetDashboardRequest {} // caller user_id injected from ctx for GetMyQuota

// EmailStats mirrors message.EmailStatsResponse (read-only snapshot).
message EmailStats {
  int64 total = 1;
  int64 sent = 2;
  int64 failed = 3;
  // success_rate in [0, 100]; -1 means "no data" (total == 0).
  double success_rate = 4;
  repeated EmailVendorStats vendors = 5;
}

// SMSStats mirrors message.SMSStatsResponse (read-only snapshot).
message SMSStats {
  int64 total = 1;
  int64 sent = 2;
  int64 failed = 3;
  double success_rate = 4;
  repeated SmsVendorStats vendors = 5;
}

// MyQuota mirrors storage.QuotaInfo (read-only snapshot of the caller's quota).
message MyQuota {
  int64 total_bytes = 1;
  int64 used_bytes = 2;
  int64 available_bytes = 3;
  int32 file_count = 4;
}

// UsersSummary is the user-count aggregate from user.ListUsersPaged (count=true).
message UsersSummary {
  int64 total = 1;
}

message DashboardResponse {
  EmailStats email_stats = 1;
  SMSStats sms_stats = 2;
  MyQuota quota = 3;
  UsersSummary users = 4;
}

service TestkitService {
  rpc Ping(google.protobuf.Empty) returns (Pong) {
    option (google.api.http) = { get: "/ping" };
  }

  rpc Login(LoginRequest) returns (TokenResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
  }

  rpc Register(RegisterRequest) returns (TokenResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/register"
      body: "*"
    };
  }

  rpc SendVerificationCode(SendVerificationCodeRequest) returns (SendVerificationCodeResponse) {
    option (google.api.http) = {
      post: "/api/v1/captcha/send"
      body: "*"
    };
  }

  // Logout revokes the caller's current session. session_id is NOT in the
  // request — it is read from the authenticated context (set by the auth
  // interceptor from the JWT).
  rpc Logout(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/api/v1/auth/logout" };
  }

  rpc RefreshSession(RefreshSessionRequest) returns (TokenResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/refresh"
      body: "*"
    };
  }

  // ==================== P2 RPCs (53 forwarders to user-service) ====================

  // ---- Profile (P2) ----
  rpc GetProfile(GetProfileRequest) returns (User) {
    option (google.api.http) = { get: "/api/v1/profile" };
  }
  rpc UpdateProfile(UpdateProfileRequest) returns (User) {
    option (google.api.http) = { put: "/api/v1/profile" body: "*" };
  }
  rpc ChangePassword(ChangePasswordRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/api/v1/profile/password" body: "*" };
  }
  rpc ResetPassword(ResetPasswordRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/api/v1/auth/password-reset" body: "*" };
  }

  // ---- Identity (P2) ----
  rpc ListIdentities(ListIdentitiesRequest) returns (ListIdentitiesResponse) {
    option (google.api.http) = { get: "/api/v1/identities" };
  }
  rpc BindIdentity(BindIdentityRequest) returns (Identity) {
    option (google.api.http) = { post: "/api/v1/identities" body: "*" };
  }
  rpc BindOAuthIdentity(BindOAuthIdentityRequest) returns (BindOAuthIdentityResponse) {
    option (google.api.http) = { post: "/api/v1/identities/oauth" body: "*" };
  }
  rpc UnbindIdentity(UnbindIdentityRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/api/v1/identities/{identity_id}" };
  }

  // ---- Session (P2) ----
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option (google.api.http) = { get: "/api/v1/sessions" };
  }
  rpc RevokeSession(RevokeSessionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/api/v1/sessions/{session_id}/revoke" };
  }
  rpc RevokeAllSessions(RevokeAllSessionsRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/api/v1/sessions/revoke-all" };
  }
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse) {
    option (google.api.http) = { get: "/api/v1/sessions/{session_id}" };
  }
  rpc IssueSessionCode(IssueSessionCodeRequest) returns (IssueSessionCodeResponse) {
    option (google.api.http) = { post: "/api/v1/sessions/issue-code" body: "*" };
  }
  rpc ExchangeSessionCode(ExchangeSessionCodeRequest) returns (ExchangeSessionCodeResponse) {
    option (google.api.http) = { post: "/api/v1/sessions/exchange" body: "*" };
  }

  // ---- Social (P2) ----
  rpc GetOAuthURL(GetOAuthURLRequest) returns (GetOAuthURLResponse) {
    option (google.api.http) = { get: "/api/v1/social/{provider}/url" };
  }
  rpc SocialLogin(SocialLoginRequest) returns (SocialLoginResponse) {
    option (google.api.http) = { post: "/api/v1/social/login" body: "*" };
  }
  rpc MiniProgramLogin(MiniProgramLoginRequest) returns (SocialLoginResponse) {
    option (google.api.http) = { post: "/api/v1/social/miniprogram" body: "*" };
  }
  rpc MiniProgramPhoneLogin(MiniProgramPhoneLoginRequest) returns (SocialLoginResponse) {
    option (google.api.http) = { post: "/api/v1/social/miniprogram/phone" body: "*" };
  }

  // ---- Admin-Users (P2) ----
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse) {
    option (google.api.http) = { post: "/api/v1/users" body: "*" };
  }
  rpc GetUser(GetUserRequest) returns (User) {
    option (google.api.http) = { get: "/api/v1/users/{user_id}" };
  }
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = { get: "/api/v1/users" };
  }
  rpc ListUsersPaged(ListUsersPagedRequest) returns (ListUsersPagedResponse) {
    option (google.api.http) = { get: "/api/v1/users/paged" };
  }
  rpc DisableUser(DisableUserRequest) returns (User) {
    option (google.api.http) = { post: "/api/v1/users/{user_id}/disable" body: "*" };
  }
  rpc GetLoginLogs(GetLoginLogsRequest) returns (GetLoginLogsResponse) {
    option (google.api.http) = { get: "/api/v1/users/login-logs" };
  }

  // ---- RBAC-Group (P2) ----
  rpc CreateGroup(CreateGroupRequest) returns (Group) {
    option (google.api.http) = { post: "/api/v1/rbac/groups" body: "*" };
  }
  rpc GetGroup(GetGroupRequest) returns (Group) {
    option (google.api.http) = { get: "/api/v1/rbac/groups/{group_id}" };
  }
  rpc UpdateGroup(UpdateGroupRequest) returns (Group) {
    option (google.api.http) = { put: "/api/v1/rbac/groups/{group_id}" body: "*" };
  }
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse) {
    option (google.api.http) = { get: "/api/v1/rbac/groups" };
  }
  rpc DeleteGroup(DeleteGroupRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/api/v1/rbac/groups/{group_id}" };
  }
  rpc AddGroupMember(AddGroupMemberRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/api/v1/rbac/groups/{group_id}/members" body: "*" };
  }
  rpc RemoveGroupMember(RemoveGroupMemberRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/api/v1/rbac/groups/{group_id}/members/{user_id}" };
  }
  rpc ListGroupMembers(ListGroupMembersRequest) returns (ListGroupMembersResponse) {
    option (google.api.http) = { get: "/api/v1/rbac/groups/{group_id}/members" };
  }
  rpc AddGroupRole(AddGroupRoleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/api/v1/rbac/groups/{group_id}/roles" body: "*" };
  }
  rpc RemoveGroupRole(RemoveGroupRoleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/api/v1/rbac/groups/{group_id}/roles/{role_id}" };
  }
  rpc ListGroupRoles(ListGroupRolesRequest) returns (ListGroupRolesResponse) {
    option (google.api.http) = { get: "/api/v1/rbac/groups/{group_id}/roles" };
  }

  // ---- RBAC-Role (P2) ----
  rpc CreateRole(CreateRoleRequest) returns (Role) {
    option (google.api.http) = { post: "/api/v1/rbac/roles" body: "*" };
  }
  rpc GetRole(GetRoleRequest) returns (Role) {
    option (google.api.http) = { get: "/api/v1/rbac/roles/{role_id}" };
  }
  rpc UpdateRole(UpdateRoleRequest) returns (Role) {
    option (google.api.http) = { put: "/api/v1/rbac/roles/{role_id}" body: "*" };
  }
  rpc DeleteRole(DeleteRoleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/api/v1/rbac/roles/{role_id}" };
  }
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse) {
    option (google.api.http) = { get: "/api/v1/rbac/roles" };
  }
  rpc AssignRole(AssignRoleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { post: "/api/v1/rbac/users/{user_id}/roles" body: "*" };
  }
  rpc RevokeRole(RevokeRoleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/api/v1/rbac/users/{user_id}/roles/{role_id}" };
  }
  rpc ListUserRoles(ListUserRolesRequest) returns (ListUserRolesResponse) {
    option (google.api.http) = { get: "/api/v1/rbac/users/{user_id}/roles" };
  }

  // ---- RBAC-Permission (P2) ----
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse) {
    option (google.api.http) = { get: "/api/v1/rbac/permissions" };
  }
  rpc CreatePermission(CreatePermissionRequest) returns (Permission) {
    option (google.api.http) = { post: "/api/v1/rbac/permissions" body: "*" };
  }
  rpc GetPermission(GetPermissionRequest) returns (Permission) {
    option (google.api.http) = { get: "/api/v1/rbac/permissions/{permission_id}" };
  }
  rpc UpdatePermission(UpdatePermissionRequest) returns (Permission) {
    option (google.api.http) = { put: "/api/v1/rbac/permissions/{permission_id}" body: "*" };
  }
  rpc DeletePermission(DeletePermissionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/api/v1/rbac/permissions/{permission_id}" };
  }
  rpc CreatePermissionGroup(CreatePermissionGroupRequest) returns (PermissionGroup) {
    option (google.api.http) = { post: "/api/v1/rbac/permission-groups" body: "*" };
  }
  rpc GetPermissionGroup(GetPermissionGroupRequest) returns (PermissionGroup) {
    option (google.api.http) = { get: "/api/v1/rbac/permission-groups/{permission_group_id}" };
  }
  rpc UpdatePermissionGroup(UpdatePermissionGroupRequest) returns (PermissionGroup) {
    option (google.api.http) = { put: "/api/v1/rbac/permission-groups/{permission_group_id}" body: "*" };
  }
  rpc DeletePermissionGroup(DeletePermissionGroupRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/api/v1/rbac/permission-groups/{permission_group_id}" };
  }
  rpc ListPermissionGroups(ListPermissionGroupsRequest) returns (ListPermissionGroupsResponse) {
    option (google.api.http) = { get: "/api/v1/rbac/permission-groups" };
  }

  // ==================== P3 RPCs (29 forwarders to storage-service) ====================
  //
  // "my" RPCs inject Owner{USER, ctx.user_id} at the BFF; their request messages
  // carry no owner field. admin / owner-quota RPCs pass owner_type+owner_id
  // through as the operation target. REST avoids enum-in-path (P3 plan decision
  // 4): owner is conveyed via body (POST/PUT) or query (GET), never a path
  // segment. Paths are prefixed /api/v1/{files,storage,admin/...}.

  // ---- Upload (owner from ctx) ----
  rpc GenerateUploadURL(GenerateUploadURLRequest) returns (GenerateUploadURLResponse) {
    option (google.api.http) = {
      post: "/api/v1/files/uploads"
      body: "*"
    };
  }
  rpc GetSTSCredential(GetSTSCredentialRequest) returns (GetSTSCredentialResponse) {
    option (google.api.http) = {
      post: "/api/v1/files/sts"
      body: "*"
    };
  }
  rpc BatchGetSTSCredential(BatchGetSTSCredentialRequest) returns (BatchGetSTSCredentialResponse) {
    option (google.api.http) = {
      post: "/api/v1/files/sts:batch"
      body: "*"
    };
  }
  rpc ConfirmUpload(ConfirmUploadRequest) returns (ConfirmUploadResponse) {
    option (google.api.http) = {
      post: "/api/v1/files/uploads:confirm"
      body: "*"
    };
  }
  rpc CancelUpload(CancelUploadRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/v1/files/uploads:cancel"
      body: "*"
    };
  }

  // ---- Download / Process (owner from ctx) ----
  rpc GenerateDownloadURL(GenerateDownloadURLRequest) returns (GenerateDownloadURLResponse) {
    option (google.api.http) = {
      post: "/api/v1/files/{file_id}:downloadUrl"
      body: "*"
    };
  }
  rpc GenerateProcessURL(GenerateProcessURLRequest) returns (GenerateProcessURLResponse) {
    option (google.api.http) = {
      post: "/api/v1/files/{file_id}:processUrl"
      body: "*"
    };
  }
  rpc GenerateCDNURL(GenerateCDNURLRequest) returns (GenerateCDNURLResponse) {
    option (google.api.http) = {
      post: "/api/v1/files/{file_id}:cdnUrl"
      body: "*"
    };
  }

  // ---- My Files (owner from ctx) ----
  rpc ListMyFiles(ListMyFilesRequest) returns (ListMyFilesResponse) {
    option (google.api.http) = { get: "/api/v1/files" };
  }
  rpc ListMyFilesPaged(ListMyFilesPagedRequest) returns (ListMyFilesPagedResponse) {
    option (google.api.http) = { get: "/api/v1/files:page" };
  }
  rpc GetMyFile(GetMyFileRequest) returns (FileInfo) {
    option (google.api.http) = { get: "/api/v1/files/{file_id}" };
  }
  rpc UpdateMyFile(UpdateMyFileRequest) returns (FileInfo) {
    option (google.api.http) = {
      patch: "/api/v1/files/{file_id}"
      body: "*"
    };
  }
  rpc DeleteMyFile(DeleteMyFileRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/api/v1/files/{file_id}" };
  }
  rpc BatchDeleteMyFiles(BatchDeleteMyFilesRequest) returns (BatchDeleteMyFilesResponse) {
    option (google.api.http) = {
      post: "/api/v1/files:batchDelete"
      body: "*"
    };
  }

  // ---- My Quota / Audit (owner from ctx) ----
  rpc GetMyQuota(google.protobuf.Empty) returns (QuotaInfo) {
    option (google.api.http) = { get: "/api/v1/storage/quota" };
  }
  rpc ListMyAuditLogs(ListMyAuditLogsRequest) returns (ListMyAuditLogsResponse) {
    option (google.api.http) = { get: "/api/v1/storage/audit-logs" };
  }

  // ---- Owner quota (owner_type+owner_id = target via body) ----
  rpc SetOwnerQuota(SetOwnerQuotaRequest) returns (QuotaInfo) {
    option (google.api.http) = {
      put: "/api/v1/storage/owners/quota"
      body: "*"
    };
  }
  rpc AddOwnerQuota(AddOwnerQuotaRequest) returns (QuotaInfo) {
    option (google.api.http) = {
      post: "/api/v1/storage/owners/quota:add"
      body: "*"
    };
  }

  // ---- Admin (owner_type+owner_id = query/op target via body/query, not path) ----
  rpc AdminListFiles(AdminListFilesRequest) returns (AdminListFilesResponse) {
    option (google.api.http) = { get: "/api/v1/admin/files" };
  }
  rpc AdminGetFile(AdminGetFileRequest) returns (AdminFileInfo) {
    option (google.api.http) = { get: "/api/v1/admin/files/{file_id}" };
  }
  rpc AdminDeleteFile(AdminDeleteFileRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = { delete: "/api/v1/admin/files/{file_id}" };
  }
  rpc AdminGetQuota(AdminGetQuotaRequest) returns (QuotaInfo) {
    option (google.api.http) = { get: "/api/v1/admin/storage/quota" };
  }
  rpc AdminSetQuota(AdminSetQuotaRequest) returns (QuotaInfo) {
    option (google.api.http) = {
      put: "/api/v1/admin/storage/quota"
      body: "*"
    };
  }
  rpc AdminGetStats(AdminGetStatsRequest) returns (AdminGetStatsResponse) {
    option (google.api.http) = { get: "/api/v1/admin/storage/stats" };
  }
  rpc AdminListProviders(google.protobuf.Empty) returns (AdminListProvidersResponse) {
    option (google.api.http) = { get: "/api/v1/admin/storage/providers" };
  }
  rpc AdminListBuckets(google.protobuf.Empty) returns (AdminListBucketsResponse) {
    option (google.api.http) = { get: "/api/v1/admin/storage/buckets" };
  }
  rpc AdminSoftDeleteOwnerFiles(AdminSoftDeleteOwnerFilesRequest) returns (AdminSoftDeleteOwnerFilesResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/storage/owners:softDeleteFiles"
      body: "*"
    };
  }
  rpc AdminDeleteOwner(AdminDeleteOwnerRequest) returns (AdminDeleteOwnerResponse) {
    option (google.api.http) = {
      post: "/api/v1/admin/storage/owners:delete"
      body: "*"
    };
  }
  rpc AdminListAuditLogs(AdminListAuditLogsRequest) returns (AdminListAuditLogsResponse) {
    option (google.api.http) = { get: "/api/v1/admin/audit-logs" };
  }

  // ---- Message (P4) ----
  //
  // sender_id (a service label, not a user id) is injected by the BFF from
  // cfg.Message.SenderID on the Send RPCs; List/Stats forward no sender_id
  // filter (ops console sees all records).

  // Send (sender_id injected from config).
  rpc SendEmail(SendEmailRequest) returns (SendResponse) {
    option (google.api.http) = {
      post: "/api/v1/messages:email"
      body: "*"
    };
  }
  rpc SendSMS(SendSMSRequest) returns (SendResponse) {
    option (google.api.http) = {
      post: "/api/v1/messages:sms"
      body: "*"
    };
  }

  // Email records.
  rpc GetEmail(GetEmailRequest) returns (EmailRecord) {
    option (google.api.http) = { get: "/api/v1/emails/{id}" };
  }
  rpc ListEmails(ListEmailsRequest) returns (ListEmailsResponse) {
    option (google.api.http) = { get: "/api/v1/emails" };
  }
  rpc ListEmailsByCursor(ListEmailsByCursorRequest) returns (ListEmailsByCursorResponse) {
    option (google.api.http) = { get: "/api/v1/emails:cursor" };
  }
  rpc GetEmailStats(GetEmailStatsRequest) returns (EmailStatsResponse) {
    option (google.api.http) = { get: "/api/v1/emails:stats" };
  }
  rpc ListEmailSenders(ListEmailSendersRequest) returns (ListEmailSendersResponse) {
    option (google.api.http) = { get: "/api/v1/emails:senders" };
  }

  // SMS records.
  rpc GetSMS(GetSMSRequest) returns (SMSRecord) {
    option (google.api.http) = { get: "/api/v1/sms/{id}" };
  }
  rpc ListSMS(ListSMSRequest) returns (ListSMSResponse) {
    option (google.api.http) = { get: "/api/v1/sms" };
  }
  rpc ListSMSByCursor(ListSMSByCursorRequest) returns (ListSMSByCursorResponse) {
    option (google.api.http) = { get: "/api/v1/sms:cursor" };
  }
  rpc GetSMSStats(GetSMSStatsRequest) returns (SMSStatsResponse) {
    option (google.api.http) = { get: "/api/v1/sms:stats" };
  }
  rpc ListSMSRegions(ListSMSRegionsRequest) returns (ListSMSRegionsResponse) {
    option (google.api.http) = { get: "/api/v1/sms:regions" };
  }
  rpc ListSMSSenders(ListSMSSendersRequest) returns (ListSMSSendersResponse) {
    option (google.api.http) = { get: "/api/v1/sms:senders" };
  }

  // ==================== P5 RPCs (gid debug + aggregated dashboard) ====================
  //
  // All four are authenticated (NOT on the public whitelist): the dashboard
  // needs the caller's user_id to inject the GetMyQuota Owner, and the gid
  // debug tools sit behind login. GetDashboard fans out to message/storage/user
  // concurrently (fail-fast); the gid RPCs are 1:1 forwards to gid-service.

  // ---- GID debug (P5) ----
  rpc NextID(NextIDRequest) returns (NextIDResponse) {
    option (google.api.http) = { get: "/api/v1/gid/next" };
  }
  rpc BatchNextID(BatchNextIDRequest) returns (BatchNextIDResponse) {
    option (google.api.http) = {
      post: "/api/v1/gid/batch"
      body: "*"
    };
  }
  rpc Decompose(DecomposeRequest) returns (DecomposeResponse) {
    option (google.api.http) = { get: "/api/v1/gid/decompose/{id}" };
  }

  // ---- Dashboard (P5, aggregated) ----
  rpc GetDashboard(GetDashboardRequest) returns (DashboardResponse) {
    option (google.api.http) = { get: "/api/v1/dashboard" };
  }
}
