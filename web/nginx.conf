# nginx serves the built SPA and reverse-proxies the API to the backend
# (grpc-gateway on :18085). Compose service name is `testkit-service`.

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip text assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Backend API (grpc-gateway). Pass the URI through unchanged
    # (/api/v1/auth/login -> :18085/api/v1/auth/login).
    location /api/ {
        proxy_pass http://testkit-service:18085;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
    }

    # Health ping (grpc-gateway /ping) — used by the generated ping service.
    location = /ping {
        proxy_pass http://testkit-service:18085;
        proxy_set_header Host $host;
    }

    # Hashed build output (umi chunks: js/css/fonts/media). Filenames carry a
    # content hash, so a given URL's bytes never change — cache immutably. A
    # MISS must be a real 404, never the SPA fallback: serving HTML for a .js
    # URL masks stale-deploy chunk requests as bogus 200s.
    location ~* \.(js|css|map|png|jpe?g|gif|svg|ico|woff2?|ttf|otf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The SPA entry must ALWAYS be revalidated with the server: index.html is
    # the only file that references the content-hashed chunks, and a stale
    # copy makes every lazy route 404 after a deploy ("Loading chunk failed").
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
